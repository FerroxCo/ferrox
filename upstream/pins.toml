[sources.xray-core]
repo          = "https://github.com/XTLS/Xray-core"
rev           = "1b1647cd9ddf0abc34b981d4611fc03bcac1ca74"
always        = true
default_branch = "main"
path          = "common/crypto"
test_enabled  = true
suite         = "go test -count=1 -timeout 20m -run '^(TestHttpConformance|TestHttpError|TestHTTPConnectMethod|TestHttpPost|TestSocksBridgeTCP|TestSocksConformanceMod|TestDokodemoTCP|TestDokodemoUDP)$' ./testing/scenarios"
ferrox_binary = "ferrox-app"
seam          = "BuildXray"
harness       = "scripts/xray-scenarios.sh"
note          = "Xray-core at this pin. The unit tests are in-process with no seam; testing/scenarios builds main at run time (BuildXray) and spawns it with -config=stdin: -format=pb (common_regular.go), so scripts/xray-scenarios.sh builds that package with go's -overlay, main.go replaced by a launcher that execs ferrox-app, and the suite spawns that: the eight tests above run against Ferrox. TestHttpBasicAuth stays out because the account map is refused by name. The package holds 72 tests across 17 families at this pin, so the gate names eight of those seventy-two: conformance.yml's scenario-map job runs every one of them against ferrox-app and records the verdicts without gating on them; the counts below are that job's, read it rather than this note after any change to the bridge. The dokodemo-door inbound, the vmess, vless and shadowsocks in/out configs and a port range now decode, so row 24's tcp rewrite flow is served through the existing front and TestDokodemoTCP plus the plain vmess and vless tests reach ferrox-app with both sides carried (that job counts 22 of the 72: vless 1/5 with TestVless green and its four tls and reality siblings held by pb streamSettings on a receiver, shadowsocks 2/4 where none reached the binary before that decode, socks 3/5 with TestSocksBridgeTCP green (the SOCKS5 client and the password front), TestSocksConformanceMod green (the SOCKS4 legs, which the front now speaks) and TestSocksBridageUDP green (the dokodemo udp door the socks scenario rides), where the family reached the binary not at all before those decodes, and its two siblings named below as the gaps they are; dokodemo 2/2 with TestDokodemoTCP and TestDokodemoUDP green, the udp half having been red until the door learned to carry a datagram; the socks ServerConfig and ClientConfig decode too and the front speaks the RFC 1929 credential exchange, so the socks family reaches ferrox-app with both sides carried; what still refuses by name is pb streamSettings on a receiver (which is every tls and reality vless sibling), and a family whose own proxy config the bridge does not carry (dns, and the router's selectors beyond the tag and the port list): the blackhole's own config now decodes and the router app's tag and port list with it, so the scenario that sends a flow to the sink reaches ferrox-app and the flow is swallowed where the reference swallows it (the feature family is 2/8 with TestBlackhole green for that reason now, and green for the wrong one before: the blackhole's config was refused and the port was never bound), while every other router selector is refused by name and the other apps are skipped as they always were; there is no trojan scenario file at this pin, so trojan's conformance is the Zray oracle seam below. The full list runs in xray-baseline.yml"

