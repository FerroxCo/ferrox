name: benchmark-matrix


on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "crates/**/*.toml"
      - "scripts/run-benchmark-matrix.sh"
      - "scripts/lib-matrix.sh"
      - "scripts/lib-engines.sh"
      - "scripts/render-benchmark-charts.py"
      - "scripts/validate-benchmark-matrix.py"
      - "docs/benchmarks/matrix.md"
      - ".github/workflows/benchmark-matrix.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Matrix tier to run"
        required: false
        default: "standard"
        type: choice
        options:
          - smoke
          - standard
          - full
      repeats:
        description: "Medians per cell per engine (blank = the tier default)"
        required: false
        default: ""
        type: string
      engines:
        description: "Comma-separated engine list (blank = the tier default)"
        required: false
        default: ""
        type: string
      runner:
        description: "Which platform measures it"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ubuntu
          - ubuntu-arm
          - macos
          - windows
      only:
        description: "Comma-separated scenario substring filter (blank = every scenario in the tier)"
        required: false
        default: ""
        type: string

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

jobs:
  setup:
    name: plan the tier and its cells
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      cells: ${{ steps.plan.outputs.cells }}
      oses: ${{ steps.plan.outputs.oses }}
      flags: ${{ steps.plan.outputs.flags }}
      trees: ${{ steps.plan.outputs.trees }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          WANT_TIER: ${{ inputs.tier }}
          WANT_ONLY: ${{ inputs.only }}
          WANT_REPEATS: ${{ inputs.repeats }}
          WANT_ENGINES: ${{ inputs.engines }}
          WANT_RUNNER: ${{ inputs.runner }}
        run: |
          matrix=true
          planned=""
          planned_engines=""
          if [[ "$EVENT" == "pull_request" ]]; then
            # A change that reaches one method is measured there, against every
            # engine that method's page records as able to serve it, at the full
            # tier's repeats; the methods it does not reach are not measured on
            # this run at all. Shared code reaches everything, so a wide plan
            # keeps the smoke cell and the nightly run carries the depth.
            if [[ "$(python3 scripts/ci-scope.py scope --base "$BASE" |
              sed -n 's/^wide=//p')" == "false" ]]; then
              tier="full"
              planned="$(python3 scripts/ci-scope.py scenarios)"
              planned_engines="$(python3 scripts/ci-scope.py engines | paste -sd, -)"
              [[ -n "$planned" ]] || matrix=false
            else
              tier="smoke"
            fi
            oses='["ubuntu-latest"]'
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            tier="${WANT_TIER:-standard}"
            case "${WANT_RUNNER:-all}" in
              ubuntu) oses='["ubuntu-latest"]' ;;
              ubuntu-arm) oses='["ubuntu-24.04-arm"]' ;;
              macos) oses='["macos-15"]' ;;
              windows) oses='["windows-latest"]' ;;
              *) oses='["ubuntu-latest", "ubuntu-24.04-arm", "macos-15", "windows-latest"]' ;;
            esac
          else
            tier="standard"
            oses='["ubuntu-latest", "ubuntu-24.04-arm", "macos-15", "windows-latest"]'
          fi
          case "$tier" in smoke | standard | full) ;; *) echo "::error::unknown tier $tier" >&2; exit 2 ;; esac
          source scripts/lib-matrix.sh
          if [[ -n "$planned" ]]; then
            ids="$planned"
          else
            ids="$(scenarios "$tier" | awk '{print $1}')"
          fi
          if [[ -n "$WANT_ONLY" ]]; then
            kept=""
            for id in $ids; do
              keep=1
              IFS=',' read -ra pats <<< "$WANT_ONLY"
              for pat in "${pats[@]}"; do [[ "$id" == *"$pat"* ]] || keep=0; done
              ((keep)) && kept="$kept $id"
            done
            ids="$kept"
          fi
          cells="$(for id in $ids; do printf '"%s",' "$id"; done)"
          cells="[${cells%,}]"
          # No cell is an error, unless the plan says so: a method the matrix does
          # not measure yet has nothing to run here and the nightly wide run has it.
          if [[ "$cells" == "[]" && "$matrix" != "false" ]]; then
            echo "::error::no scenario survived the filter" >&2
            exit 1
          fi
          flags=""
          [[ -n "$WANT_REPEATS" ]] && flags="$flags --repeats $WANT_REPEATS"
          trees="xray-core,xray-core-rust,sing-box,zeronet,leaf"
          if [[ -n "$WANT_ENGINES" ]]; then
            # A typed list is the caller's own, ferrox included or not.
            flags="$flags --engines $WANT_ENGINES"
          elif [[ -n "$planned_engines" ]]; then
            # The page ruled the rest out, so this run neither fetches, builds nor
            # probes them; the nightly wide run still measures everything.
            flags="$flags --engines ferrox,$planned_engines"
            trees="$planned_engines"
          elif [[ "$tier" == "smoke" ]]; then
            trees="xray-core,xray-core-rust"
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "oses=$oses" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "trees=$trees" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "tier $tier cells: $cells"

  fetch:
    name: fetch the comparator trees this plan compares against
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.matrix == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: fetch at the pins
        shell: bash
        env:
          TREES: ${{ needs.setup.outputs.trees }}
        run: ./scripts/fetch-upstream.sh --only "$TREES"
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-trees
          path: upstream/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: build the engines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [setup, fetch]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: upstream/pins.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: benchmark-matrix
      - name: install the QUIC build tool
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress || echo "nasm already installed"
      - name: install protoc for xray-core-rust
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler ;;
            macOS) brew install protobuf ;;
            Windows) choco install protoc -y --no-progress || echo "protoc already installed" ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: upstream-trees
          path: upstream
      - uses: actions/cache@v4
        with:
          path: target/parity-engines
          key: matrix-engines-${{ matrix.os }}-${{ hashFiles('upstream/pins.toml', 'scripts/lib-engines.sh') }}
      - name: build every engine without moving traffic
        shell: bash
        env:
          FERROX_UPSTREAM_HANDOFF: "1"
        run: >
          ./scripts/run-benchmark-matrix.sh
          --tier "${{ needs.setup.outputs.tier }}"
          --out target/benchmark-matrix
          --probe-only
          ${{ needs.setup.outputs.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-ferrox-${{ matrix.os }}
          path: |
            target/release/ferrox-bench*
            target/release/ferrox-app*
          retention-days: 1
          if-no-files-found: error

  cells:
    name: measure ${{ matrix.cell }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [setup, build]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}
        cell: ${{ fromJSON(needs.setup.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No pip cache here: this job installs nothing, so setup-python's post
      # step has no cache to save and fails on the empty folder.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: matrix-ferrox-${{ matrix.os }}
          path: target/release
      # Hash the handed-over pins file as the build job did: a Windows checkout's line endings would key a cache the build never wrote.
      - uses: actions/download-artifact@v4
        with:
          name: upstream-trees
          path: upstream
      - uses: actions/cache@v4
        with:
          path: target/parity-engines
          key: matrix-engines-${{ matrix.os }}-${{ hashFiles('upstream/pins.toml', 'scripts/lib-engines.sh') }}
      - name: run one cell with handed-over binaries
        shell: bash
        env:
          FERROX_UPSTREAM_HANDOFF: "1"
        run: >
          ./scripts/run-benchmark-matrix.sh
          --tier "${{ needs.setup.outputs.tier }}"
          --out target/benchmark-matrix
          --only "${{ matrix.cell }}"
          --no-build
          ${{ needs.setup.outputs.flags }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-cell-${{ matrix.os }}-${{ matrix.cell }}
          path: target/benchmark-matrix/
          retention-days: 1
          if-no-files-found: error

  collect:
    name: render the bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [setup, cells]
    # `!cancelled()` alone would run this after a skipped matrix: the plan decided
    # no cell of it is in scope, and a render over an empty bundle is a red job.
    if: ${{ !cancelled() && needs.setup.outputs.matrix == 'true' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-benchmark.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-cell-${{ matrix.os }}-*
          path: cell-bundles/
      - name: install the chart dependency
        shell: bash
        run: pip install -r scripts/requirements-benchmark.txt
      - name: merge the cells and render once
        shell: bash
        run: |
          rm -rf target/benchmark-matrix
          mkdir -p target/benchmark-matrix/cells
          first=""
          for bundle in cell-bundles/matrix-cell-${{ matrix.os }}-*/; do
            [[ -z "$first" ]] && first="$bundle"
            cp -r "$bundle"/cells/* target/benchmark-matrix/cells/
            cat "$bundle/commands.sh" >> target/benchmark-matrix/commands.sh
          done
          [[ -n "$first" ]] || { echo "::error::no cell bundle for ${{ matrix.os }}" >&2; exit 1; }
          cp "$first/manifest.txt" target/benchmark-matrix/manifest.txt
          python3 scripts/render-benchmark-charts.py \
            --input target/benchmark-matrix \
            --charts target/benchmark-matrix/charts \
            --results target/benchmark-matrix/matrix-results.json
          python3 scripts/validate-benchmark-matrix.py \
            --cells target/benchmark-matrix/cells \
            --results target/benchmark-matrix/matrix-results.json \
            --charts target/benchmark-matrix/charts
          python3 scripts/check-matrix-legs.py --cells target/benchmark-matrix/cells
      - name: refuse a bundle that measured nothing
        shell: bash
        run: |
          cells="$(find target/benchmark-matrix/cells -name cell.json | wc -l)"
          echo "cells with a report: $cells"
          if [[ "$cells" == "0" ]]; then
            echo "::error::no matrix cell produced a report on ${{ matrix.os }}; \
              the run above exited 0 without measuring anything"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-matrix-${{ needs.setup.outputs.tier }}-${{ matrix.os }}
          path: target/benchmark-matrix/
          retention-days: 30
          if-no-files-found: error

  refresh:
    name: publish the dated bundles
    needs: collect
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: benchmark-refresh
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-benchmark.txt
      - name: install the chart dependency
        run: pip install -r scripts/requirements-benchmark.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-matrix-standard-*
          path: matrix-bundles/
      - name: stamp the bundle date once
        run: echo "STAMP=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: lay out per-runner bundles
        run: |
          for bundle in matrix-bundles/benchmark-matrix-standard-*/; do
            slug="$(grep -m1 '^runner: ' "$bundle/manifest.txt" | cut -d' ' -f2)"
            if [[ -z "$slug" ]]; then
              echo "::error::$bundle has no runner: line in manifest.txt"
              exit 1
            fi
            dest="matrix-published/$STAMP/$slug"
            results="docs/benchmarks/results/$STAMP/$slug"
            charts="docs/benchmarks/charts/latest/$slug"
            mkdir -p "$dest/charts" "$results" "$charts"
            cp "$bundle/matrix-results.json" "$bundle/manifest.txt" "$results/"
            cp "$results/matrix-results.json" "$results/manifest.txt" "$dest/"
            cp -r "$bundle/cells" "$dest/cells"
            python3 scripts/render-benchmark-charts.py \
              --input "$bundle" \
              --charts "$charts" \
              --results "$results/matrix-results.json" \
              --readme docs/benchmarks/matrix.md \
              --runner "$slug"
            cp "$charts"/*.png "$dest/charts/"
            python3 scripts/validate-benchmark-matrix.py \
              --cells "$dest/cells" \
              --results "$results/matrix-results.json" \
              --charts "$charts"
          done
      - name: commit the refreshed matrix on a review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C benchmark-matrix/auto
          git add docs/benchmarks/matrix.md docs/benchmarks/charts/latest docs/benchmarks/results
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "docs: refresh benchmark matrix ($STAMP)"
          git push --force-with-lease origin benchmark-matrix/auto
          existing="$(gh pr list --head benchmark-matrix/auto --state open --json number --jq '.[0].number // empty')"
          [[ -n "$existing" ]] || gh pr create --base main --head benchmark-matrix/auto \
            --title "docs: refresh benchmark matrix" \
            --body "Automated refresh of docs/benchmarks/matrix.md and the latest charts from the scheduled matrix run."
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-matrix-published-${{ env.STAMP }}
          path: matrix-published/
          retention-days: 90
          if-no-files-found: error
